version: "2"

linters:
  enable:
    - gocognit
    - gosec
    - misspell
    - modernize
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused

  settings:
    gocognit:
      # Minimal cognitive complexity to report
      min-complexity: 15

    staticcheck:
      checks:
        - all

    gosec:
      excludes:
        - G304  # File path provided as taint input (expected for CLI tools)

issues:
  exclude-dirs:
    - internal/proto/pb  # Generated protobuf code
